name: Pages

# Publishes site/ as it is, with no Jekyll and no build step (ADR 0008).
# GitHub Pages must be on in the repo settings with "GitHub Actions" as its
# source.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
